<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sandhya R. — Better Code, Bigger Dreams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2a3d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363d"/>

  <!-- left: text -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="96" fill="#8b949e" font-size="18" letter-spacing="3">SANDHYA R.</text>
    <text x="64" y="160" fill="#f0f6fc" font-size="52" font-weight="700">Better Code,</text>
    <text x="64" y="218" fill="url(#accent)" font-size="52" font-weight="700">Bigger Dreams</text>
    <text x="64" y="258" fill="#8b949e" font-size="18">Backend &amp; Full-Stack Development</text>
  </g>

  <!-- right: code window -->
  <g transform="translate(700 52)">
    <rect width="440" height="196" rx="10" fill="#161b22" stroke="#30363d"/>
    <path d="M0 10a10 10 0 0 1 10-10h420a10 10 0 0 1 10 10v22H0z" fill="#1c2330"/>
    <circle cx="20" cy="16" r="5" fill="#ff7b72"/>
    <circle cx="38" cy="16" r="5" fill="#d29922"/>
    <circle cx="56" cy="16" r="5" fill="#3fb950"/>
    <text x="220" y="21" fill="#6e7681" font-size="12" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">main.py</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="15">
      <text x="22" y="62"><tspan fill="#ff7b72">from</tspan><tspan fill="#c9d1d9"> fastapi </tspan><tspan fill="#ff7b72">import</tspan><tspan fill="#c9d1d9"> FastAPI</tspan></text>
      <text x="22" y="90" fill="#c9d1d9">app = <tspan fill="#d2a8ff">FastAPI</tspan>()</text>
      <text x="22" y="126"><tspan fill="#d2a8ff">@app</tspan><tspan fill="#c9d1d9">.get(</tspan><tspan fill="#a5d6ff">"/dreams"</tspan><tspan fill="#c9d1d9">)</tspan></text>
      <text x="22" y="152"><tspan fill="#ff7b72">def</tspan><tspan fill="#d2a8ff"> build</tspan><tspan fill="#c9d1d9">():</tspan></text>
      <text x="54" y="178"><tspan fill="#ff7b72">return</tspan><tspan fill="#c9d1d9"> {</tspan><tspan fill="#a5d6ff">"keep"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"growing"</tspan><tspan fill="#c9d1d9">}</tspan></text>
    </g>
  </g>
</svg>
