<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sandhya R. — Backend &amp; AI Developer. Building scalable APIs and AI-powered applications.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.6" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#0f1f3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2d4d"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, 'SF Mono', 'Courier New', monospace; }
      .flow { stroke-dasharray: 4 6; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)" opacity="0.7"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#1e2d4d"/>
  <rect x="0" y="0" width="6" height="320" rx="3" fill="url(#accent)"/>

  <!-- left: identity -->
  <g class="sans">
    <text x="64" y="84" fill="#94a3b8" font-size="16" letter-spacing="4" font-weight="600">HELLO, I'M</text>
    <text x="64" y="146" fill="#f8fafc" font-size="58" font-weight="800">Sandhya R.</text>
    <rect x="66" y="164" width="120" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="64" y="204" fill="url(#accent)" font-size="26" font-weight="700">Backend &amp; AI Developer</text>
    <text x="64" y="236" fill="#94a3b8" font-size="17">Building scalable APIs and AI-powered applications</text>
  </g>

  <!-- left: tech chips -->
  <g class="mono" font-size="13" fill="#cbd5e1">
    <g transform="translate(64 260)">
      <rect width="78" height="28" rx="14" fill="#111d36" stroke="#26375c"/>
      <text x="39" y="18.5" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(150 260)">
      <rect width="70" height="28" rx="14" fill="#111d36" stroke="#26375c"/>
      <text x="35" y="18.5" text-anchor="middle">Django</text>
    </g>
    <g transform="translate(228 260)">
      <rect width="76" height="28" rx="14" fill="#111d36" stroke="#26375c"/>
      <text x="38" y="18.5" text-anchor="middle">Next.js</text>
    </g>
    <g transform="translate(312 260)">
      <rect width="92" height="28" rx="14" fill="#111d36" stroke="#26375c"/>
      <text x="46" y="18.5" text-anchor="middle">LangChain</text>
    </g>
    <g transform="translate(412 260)">
      <rect width="98" height="28" rx="14" fill="#111d36" stroke="#26375c"/>
      <text x="49" y="18.5" text-anchor="middle">PostgreSQL</text>
    </g>
    <g transform="translate(518 260)">
      <rect width="70" height="28" rx="14" fill="#111d36" stroke="#26375c"/>
      <text x="35" y="18.5" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- right: system diagram -->
  <g transform="translate(700 46)" class="mono">
    <rect width="452" height="228" rx="14" fill="#0b1426" fill-opacity="0.85" stroke="#26375c"/>
    <text x="22" y="30" fill="#64748b" font-size="12" letter-spacing="2">// WHAT I BUILD</text>

    <!-- connectors -->
    <g fill="none" stroke="#3b82f6" stroke-width="1.6">
      <path class="flow" d="M118 112 H170"/>
      <path class="flow" d="M282 112 C310 112 310 65 338 65"/>
      <path class="flow" d="M282 112 H338"/>
      <path class="flow" d="M282 112 C310 112 310 153 338 153"/>
      <path class="flow" d="M226 136 V176"/>
    </g>

    <!-- client -->
    <g transform="translate(20 90)">
      <rect width="98" height="44" rx="9" fill="#111d36" stroke="#26375c"/>
      <text x="49" y="20" text-anchor="middle" fill="#e2e8f0" font-size="13">Client</text>
      <text x="49" y="35" text-anchor="middle" fill="#64748b" font-size="10">React · Next.js</text>
    </g>

    <!-- api -->
    <g transform="translate(170 88)">
      <rect width="112" height="48" rx="9" fill="#14234a" stroke="#facc15"/>
      <text x="56" y="22" text-anchor="middle" fill="#facc15" font-size="14" font-weight="700">REST API</text>
      <text x="56" y="38" text-anchor="middle" fill="#94a3b8" font-size="10">FastAPI · Django</text>
    </g>

    <!-- right column -->
    <g transform="translate(338 48)">
      <rect width="96" height="34" rx="8" fill="#111d36" stroke="#26375c"/>
      <text x="48" y="21.5" text-anchor="middle" fill="#e2e8f0" font-size="12">LLM · RAG</text>
    </g>
    <g transform="translate(338 92)">
      <rect width="96" height="34" rx="8" fill="#111d36" stroke="#26375c"/>
      <text x="48" y="21.5" text-anchor="middle" fill="#e2e8f0" font-size="12">PostgreSQL</text>
    </g>
    <g transform="translate(338 136)">
      <rect width="96" height="34" rx="8" fill="#111d36" stroke="#26375c"/>
      <text x="48" y="21.5" text-anchor="middle" fill="#e2e8f0" font-size="12">Redis · Jobs</text>
    </g>

    <!-- bottom -->
    <g transform="translate(170 176)">
      <rect width="112" height="32" rx="8" fill="#111d36" stroke="#26375c"/>
      <text x="56" y="20.5" text-anchor="middle" fill="#e2e8f0" font-size="12">Docker · AWS</text>
    </g>

    <!-- status -->
    <circle class="pulse" cx="28" cy="198" r="4" fill="#22c55e"/>
    <text x="40" y="202" fill="#64748b" font-size="11">tests passing</text>
  </g>
</svg>
